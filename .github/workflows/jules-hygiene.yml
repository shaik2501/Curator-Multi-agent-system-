name: Jules Autonomous Hygiene Pipeline

on:
  schedule:
    # 00:00, 06:00, 12:00, and 18:00 UTC every day.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jules-hygiene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agentic-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify Jules configuration
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "JULES_API_KEY is not configured as a repository Actions secret." >&2
            exit 1
          fi

      - name: Invoke Jules coding agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.repository.default_branch }}
          include_last_commit: true
          include_commit_log: true
          prompt: |
            Audit the core modules for latent technical debt.
            Identify and update deprecated package dependencies where it is safe to do so.
            Refactor inefficient syntax only when the improvement can be verified.
            Run the relevant backend and frontend checks before proposing changes.
            Create a focused pull request that explains the architectural impact.
            If no safe, useful change is available, do not create a change solely to open a pull request.

      - name: Update generated automation status
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          start = "<!-- automation-status:start -->"
          end = "<!-- automation-status:end -->"
          if start not in text or end not in text:
              raise SystemExit("README automation status markers are missing")

          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          generated = f"""{start}
          ## Automated Hygiene Status

          <!-- Generated by .github/workflows/jules-hygiene.yml; do not edit manually. -->
          Last successful Jules dispatch: **{timestamp}**

          Schedule: every six hours at 00:00, 06:00, 12:00, and 18:00 UTC.
          {end}"""
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + generated + after, encoding="utf-8")
          PY

      - name: Commit status update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Attribute genuine generated updates to the repository owner while
          # actions/checkout's built-in GITHUB_TOKEN remains the pusher.
          git config user.name "Shaik Muhammad Awaiz"
          git config user.email "168328216+shaik2501@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README status is already current; nothing to commit."
            exit 0
          fi

          git commit -m "chore: update automated hygiene status"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
