name: Jules Autonomous Hygiene Pipeline

on:
  schedule:
    # Executes every 6 hours on the dot
    - cron: '0 */6 * * *'
  workflow_dispatch: # Retains a manual trigger for on-demand execution

jobs:
  agentic-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Invoke Jules Coding Agent
        uses: google-labs-code/jules-action@main
        with:
          api-key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Audit the core modules for latent technical debt.
            Identify and bump any deprecated package dependencies.
            Refactor inefficient syntax and isolate the optimizations in a new branch.
            Generate a pull request detailing the architectural impact of these changes.
